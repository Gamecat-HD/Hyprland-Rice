# Farben fuer hyprlock -- erzeugt von `dynamic-island scheme` / `... wallpaper`.
# NICHT von Hand bearbeiten, die Datei wird bei jedem Themewechsel neu
# geschrieben. Das Layout steht in ~/.config/hypr/hyprlock.conf und holt sich
# diese Datei per `source`.

# Flaechen
$background          = rgb(0b0f11)
$surface             = rgb(0b0f11)
$surfaceContainer    = rgb(141b1d)
$surfaceBright       = rgb(252d31)

# Schrift auf den Flaechen
$onBackground        = rgb(dee7ec)
$onSurface           = rgb(dee7ec)
$onSurfaceVariant    = rgb(a3acb1)

# Linien
$outline             = rgb(6e777b)
$outlineVariant      = rgb(40494d)

# Akzente
$primary             = rgb(a1cde1)
$primaryDim          = rgb(93bfd2)
$onPrimary           = rgb(154556)
$secondary           = rgb(b3cad5)
$tertiary            = rgb(d3e0ff)
$error               = rgb(fa746f)
$onError             = rgb(490006)

# Halbtransparente Varianten fuer Karte und Eingabefeld
$surfaceCard         = rgba(0b0f11c0)
$surfaceInner        = rgba(141b1de6)
$outlineSoft         = rgba(40494d99)
$shadow              = rgba(0000005a)
